name: Mise à jour des dates
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_dates.py
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Enregistrer les changements
        run: |
          git config user.name "dj-map-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Dates mises à jour" && git push)

      
